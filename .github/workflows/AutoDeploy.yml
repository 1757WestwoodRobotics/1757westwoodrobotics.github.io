name: Deploy to GitHub Pages

on:
  push:
    branches: [ next ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        env:
          VITE_TBA_KEY: ${{ secrets.TBA_API_KEY }}
          VITE_EVENT_KEY: ${{ secrets.EVENT_KEY }}
          VITE_SCOUTING_CSV_URL: ${{ secrets.SCOUTING_CSV_URL }}
          VITE_PIT_CSV_URL: ${{ secrets.PIT_CSV_URL }}
          VITE_PIT_SCOUTING_FORM_URL: ${{ secrets.PIT_SCOUTING_FORM_URL }}
          VITE_SCOUTS_CSV_URL: ${{ secrets.SCOUTS_CSV_URL }}
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
